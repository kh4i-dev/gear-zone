  <line x1="1327" y1="599" x2="1373" y2="599" stroke="#111827" stroke-width="2"/>
  <line x1="1350" y1="622" x2="1331" y2="650" stroke="#111827" stroke-width="2"/>
  <line x1="1350" y1="622" x2="1369" y2="650" stroke="#111827" stroke-width="2"/>
  <text x="1350" y="668" text-anchor="middle" font-size="12" font-weight="bold" fill="#111827">NHÂN VIÊN KHO</text>

