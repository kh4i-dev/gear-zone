  <text x="714" y="216" font-size="10" fill="#4b5563">«extend»</text>

  <!-- Thanh toán online <<include>> Xác nhận TT online -->
  <line x1="975" y1="268" x2="992" y2="324" stroke="#111827" stroke-width="1.3" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <text x="996" y="302" font-size="10" fill="#4b5563">«include»</text>

