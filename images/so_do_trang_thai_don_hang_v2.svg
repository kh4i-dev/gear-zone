<svg width="100%" viewBox="-40 -40 800 770" role="img" style="background-color:#ffffff" xmlns="http://www.w3.org/2000/svg">
  <title>Sơ đồ trạng thái đơn hàng GearZone</title>
  <desc>Vòng đời đơn hàng từ khi đặt đến hoàn thành hoặc hủy, bao gồm nhánh thanh toán online và COD, chuẩn hóa UML đơn sắc</desc>
  <defs>
    <style>
      .state-rect {
        fill: #ffffff;
        stroke: #111827;
        stroke-width: 1.5px;
      }
      .state-text {
        fill: #111827;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .transition-line {
        fill: none;
        stroke: #374151;
        stroke-width: 1.2px;
      }
      .transition-text {
        fill: #374151;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        dominant-baseline: central;
      }
      .text-left {
        text-anchor: start;
      }
      .text-center {
        text-anchor: middle;
      }
      .text-halo {
        stroke: #ffffff;
        stroke-width: 4px;
        paint-order: stroke;
      }
      .legend-text {
        fill: #4b5563;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        dominant-baseline: central;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect id="canvas-bg" x="-100" y="-100" width="920" height="850" fill="#ffffff" stroke="none"/>

  <!-- START -->
  <circle cx="340" cy="28" r="9" fill="#111827"/>
  <line x1="340" y1="37" x2="340" y2="56" class="transition-line" marker-end="url(#arrow)"/>
  <text x="355" y="44" class="transition-text text-left">Khách đặt hàng</text>

  <!-- Chờ xác nhận -->
  <g cursor="pointer">
    <rect x="250" y="56" width="180" height="40" rx="8" class="state-rect"/>
    <text x="340" y="76" class="state-text">Chờ xác nhận</text>
  </g>

  <!-- Split line under Chờ xác nhận -->
  <line x1="340" y1="96" x2="340" y2="120" class="transition-line"/>
  <line x1="180" y1="120" x2="500" y2="120" class="transition-line"/>
  <line x1="180" y1="120" x2="180" y2="136" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="500" y2="136" class="transition-line" marker-end="url(#arrow)"/>
  
  <text x="140" y="112" class="transition-text text-center text-halo">Thanh toán Online</text>
  <text x="540" y="112" class="transition-text text-center text-halo">Thanh toán COD</text>

  <!-- Chờ thanh toán (nhánh trái) -->
  <g cursor="pointer">
    <rect x="100" y="136" width="160" height="40" rx="8" class="state-rect"/>
    <text x="180" y="156" class="state-text">Chờ thanh toán</text>
  </g>

  <!-- Thanh toán thất bại -->
  <g cursor="pointer">
    <rect x="20" y="236" width="140" height="40" rx="8" class="state-rect"/>
    <text x="90" y="256" class="state-text">TT thất bại</text>
  </g>

  <!-- Split line under Chờ thanh toán -->
  <line x1="180" y1="176" x2="180" y2="210" class="transition-line"/>
  <line x1="90" y1="210" x2="250" y2="210" class="transition-line"/>
  <line x1="90" y1="210" x2="90" y2="236" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="250" y1="210" x2="250" y2="236" class="transition-line" marker-end="url(#arrow)"/>
  
  <text x="90" y="202" class="transition-text text-center text-halo">Lỗi thanh toán</text>
  <text x="250" y="202" class="transition-text text-center text-halo">Thành công</text>

  <!-- Đã thanh toán -->
  <g cursor="pointer">
    <rect x="170" y="236" width="160" height="40" rx="8" class="state-rect"/>
    <text x="250" y="256" class="state-text">Đã thanh toán</text>
  </g>

  <!-- Thử lại thanh toán -->
  <path d="M90 276 L90 300 L165 300 L165 176" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="127" y="294" class="transition-text text-center text-halo">Thử lại</text>

  <!-- COD → Đang xử lý -->
  <g cursor="pointer">
    <rect x="420" y="136" width="160" height="40" rx="8" class="state-rect"/>
    <text x="500" y="156" class="state-text">Đang xử lý</text>
  </g>

  <!-- Đã TT → Đang xử lý -->
  <path d="M250 276 L250 316 L500 316 L500 176" class="transition-line" marker-end="url(#arrow)"/>
  <text x="375" y="310" class="transition-text text-center text-halo">Admin xác nhận</text>

  <!-- Đang xử lý → Đang giao -->
  <g cursor="pointer">
    <rect x="420" y="236" width="160" height="40" rx="8" class="state-rect"/>
    <text x="500" y="256" class="state-text">Đang giao hàng</text>
  </g>
  <line x1="500" y1="176" x2="500" y2="236" class="transition-line" marker-end="url(#arrow)"/>
  <text x="512" y="206" class="transition-text text-left text-halo">Xuất kho</text>

  <!-- Đang giao → 2 nhánh (Thành công / Thất bại) -->
  <line x1="500" y1="276" x2="500" y2="340" class="transition-line"/>
  <line x1="410" y1="340" x2="570" y2="340" class="transition-line"/>
  <line x1="410" y1="340" x2="410" y2="356" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="570" y1="340" x2="570" y2="356" class="transition-line" marker-end="url(#arrow)"/>
  
  <text x="410" y="332" class="transition-text text-center text-halo">Giao thất bại</text>
  <text x="570" y="332" class="transition-text text-center text-halo">Giao thành công</text>

  <!-- Đã giao -->
  <g cursor="pointer">
    <rect x="500" y="356" width="140" height="40" rx="8" class="state-rect"/>
    <text x="570" y="376" class="state-text">Đã giao hàng</text>
  </g>

  <!-- Giao thất bại -->
  <g cursor="pointer">
    <rect x="340" y="356" width="140" height="40" rx="8" class="state-rect"/>
    <text x="410" y="376" class="state-text">Giao thất bại</text>
  </g>

  <!-- Giao lại -->
  <path d="M410 396 L410 424 L490 424 L490 276" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="450" y="418" class="transition-text text-center text-halo">Giao lại</text>

  <!-- Đã giao → Hoàn thành -->
  <g cursor="pointer">
    <rect x="500" y="450" width="140" height="40" rx="8" class="state-rect"/>
    <text x="570" y="470" class="state-text">Hoàn thành</text>
  </g>
  <line x1="570" y1="396" x2="570" y2="450" class="transition-line" marker-end="url(#arrow)"/>
  <text x="582" y="420" class="transition-text text-left text-halo">KH xác nhận</text>

  <!-- END hoàn thành -->
  <circle cx="570" cy="520" r="9" fill="none" stroke="#111827" stroke-width="1.5"/>
  <circle cx="570" cy="520" r="5" fill="#111827"/>
  <line x1="570" y1="490" x2="570" y2="511" class="transition-line" marker-end="url(#arrow)"/>

  <!-- ========= NHÁNH HỦY ========= -->
  <!-- Đã hủy -->
  <g cursor="pointer">
    <rect x="40" y="450" width="130" height="40" rx="8" class="state-rect"/>
    <text x="105" y="470" class="state-text">Đã hủy</text>
  </g>

  <!-- Chờ xác nhận → Đã hủy -->
  <path d="M250 76 L15 76 L15 470 L40 470" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="130" y="70" class="transition-text text-center text-halo">KH / Admin hủy</text>

  <!-- Đã TT → Hủy (có hoàn tiền) -->
  <path d="M230 276 L230 430 L105 430 L105 450" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="230" y="356" class="transition-text text-center text-halo">Yêu cầu hủy</text>

  <!-- Đã hủy → Hoàn tiền (nếu đã TT) -->
  <g cursor="pointer">
    <rect x="40" y="550" width="130" height="40" rx="8" class="state-rect"/>
    <text x="105" y="570" class="state-text">Hoàn tiền</text>
  </g>
  <line x1="105" y1="490" x2="105" y2="550" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="120" y="520" class="transition-text text-center text-halo">Đã TT trước</text>

  <!-- END hủy -->
  <circle cx="105" cy="626" r="9" fill="none" stroke="#111827" stroke-width="1.5"/>
  <circle cx="105" cy="626" r="5" fill="#111827"/>
  <line x1="105" y1="590" x2="105" y2="617" class="transition-line" marker-end="url(#arrow)"/>

  <!-- ================= LEGEND ================= -->
  <line x1="20" y1="665" x2="700" y2="665" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Start state -->
  <circle cx="30" cy="700" r="7" fill="#111827"/>
  <text x="45" y="700" class="legend-text">Trạng thái bắt đầu</text>

  <!-- State -->
  <rect x="190" y="691" width="30" height="18" rx="4" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="230" y="700" class="legend-text">Trạng thái</text>

  <!-- Transition -->
  <line x1="330" y1="700" x2="370" y2="700" class="transition-line" marker-end="url(#arrow)"/>
  <text x="380" y="700" class="legend-text">Chuyển trạng thái</text>

  <!-- End state -->
  <circle cx="530" cy="700" r="7" fill="none" stroke="#111827" stroke-width="1"/>
  <circle cx="530" cy="700" r="4" fill="#111827"/>
  <text x="545" y="700" class="legend-text">Trạng thái kết thúc</text>
</svg>
