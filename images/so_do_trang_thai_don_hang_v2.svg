<svg width="100%" viewBox="-20 -20 760 720" role="img" style="background-color:#ffffff" xmlns="http://www.w3.org/2000/svg">
  <title>Sơ đồ trạng thái đơn hàng GearZone</title>
  <desc>Vòng đời đơn hàng từ khi đặt đến hoàn thành hoặc hủy, bao gồm nhánh thanh toán online và COD, chuẩn hóa UML đơn sắc</desc>
  <defs>
    <style>
      .state-rect {
        fill: #ffffff;
        stroke: #111827;
        stroke-width: 1.5px;
      }
      .state-text {
        fill: #111827;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .transition-line {
        fill: none;
        stroke: #374151;
        stroke-width: 1.2px;
      }
      .transition-text {
        fill: #374151;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 500;
        dominant-baseline: central;
      }
      .text-left { text-anchor: start; }
      .text-center { text-anchor: middle; }
      .text-halo {
        stroke: #ffffff;
        stroke-width: 4px;
        paint-order: stroke;
      }
      .legend-text {
        fill: #4b5563;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 500;
        dominant-baseline: central;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect id="canvas-bg" x="-80" y="-80" width="900" height="860" fill="#ffffff" stroke="none"/>

  <!-- ==================== ROW 0: START ==================== -->
  <circle cx="360" cy="20" r="9" fill="#111827"/>
  <line x1="360" y1="29" x2="360" y2="50" class="transition-line" marker-end="url(#arrow)"/>
  <text x="380" y="38" class="transition-text text-left text-halo">Khách đặt hàng</text>

  <!-- ==================== ROW 1: Chờ xác nhận ==================== -->
  <rect x="275" y="50" width="170" height="40" rx="0" class="state-rect"/>
  <text x="360" y="70" class="state-text">Chờ xác nhận</text>

  <!-- Split: Thanh toán Online (trái) / Thanh toán COD (phải) -->
  <line x1="360" y1="90" x2="360" y2="115" class="transition-line"/>
  <line x1="180" y1="115" x2="540" y2="115" class="transition-line"/>
  <line x1="180" y1="115" x2="180" y2="140" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="540" y1="115" x2="540" y2="140" class="transition-line" marker-end="url(#arrow)"/>
  <text x="180" y="108" class="transition-text text-center text-halo">Thanh toán Online</text>
  <text x="540" y="108" class="transition-text text-center text-halo">Thanh toán COD</text>

  <!-- ==================== ROW 2 LEFT: Chờ thanh toán ==================== -->
  <rect x="95" y="140" width="170" height="40" rx="0" class="state-rect"/>
  <text x="180" y="160" class="state-text">Chờ thanh toán</text>

  <!-- ==================== ROW 2 RIGHT: Đang xử lý ==================== -->
  <rect x="455" y="140" width="170" height="40" rx="0" class="state-rect"/>
  <text x="540" y="160" class="state-text">Đang xử lý</text>

  <!-- Split Chờ thanh toán → Lỗi (trái) / Thành công (phải) -->
  <line x1="180" y1="180" x2="180" y2="205" class="transition-line"/>
  <line x1="90" y1="205" x2="290" y2="205" class="transition-line"/>
  <line x1="90" y1="205" x2="90" y2="230" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="290" y1="205" x2="290" y2="230" class="transition-line" marker-end="url(#arrow)"/>
  <text x="90" y="198" class="transition-text text-center text-halo">Lỗi thanh toán</text>
  <text x="290" y="198" class="transition-text text-center text-halo">Thành công</text>

  <!-- ==================== ROW 3 LEFT-LEFT: TT thất bại ==================== -->
  <rect x="15" y="230" width="150" height="40" rx="0" class="state-rect"/>
  <text x="90" y="250" class="state-text">TT thất bại</text>

  <!-- ==================== ROW 3 LEFT-RIGHT: Đã thanh toán ==================== -->
  <rect x="210" y="230" width="160" height="40" rx="0" class="state-rect"/>
  <text x="290" y="250" class="state-text">Đã thanh toán</text>

  <!-- Thử lại: TT thất bại → Chờ thanh toán -->
  <path d="M90 270 L90 290 L155 290 L155 180" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="122" y="284" class="transition-text text-center text-halo">Thử lại</text>

  <!-- ==================== ROW 3 RIGHT: Đang giao hàng ==================== -->
  <rect x="455" y="230" width="170" height="40" rx="0" class="state-rect"/>
  <text x="540" y="250" class="state-text">Đang giao hàng</text>

  <!-- Đang xử lý → Đang giao hàng -->
  <line x1="540" y1="180" x2="540" y2="230" class="transition-line" marker-end="url(#arrow)"/>
  <text x="555" y="205" class="transition-text text-left text-halo">Xuất kho</text>

  <!-- Đã thanh toán → Đang giao hàng (Admin xác nhận) -->
  <path d="M290 270 L290 300 L540 300 L540 270" class="transition-line" marker-end="url(#arrow)"/>
  <text x="415" y="294" class="transition-text text-center text-halo">Admin xác nhận</text>

  <!-- Split Đang giao → Giao thất bại (trái) / Giao thành công (phải) -->
  <line x1="540" y1="270" x2="540" y2="320" class="transition-line"/>
  <line x1="440" y1="320" x2="640" y2="320" class="transition-line"/>
  <line x1="440" y1="320" x2="440" y2="345" class="transition-line" marker-end="url(#arrow)"/>
  <line x1="640" y1="320" x2="640" y2="345" class="transition-line" marker-end="url(#arrow)"/>
  <text x="440" y="313" class="transition-text text-center text-halo">Giao thất bại</text>
  <text x="640" y="313" class="transition-text text-center text-halo">Giao thành công</text>

  <!-- ==================== ROW 4: Giao thất bại / Đã giao hàng ==================== -->
  <rect x="365" y="345" width="150" height="40" rx="0" class="state-rect"/>
  <text x="440" y="365" class="state-text">Giao thất bại</text>

  <rect x="565" y="345" width="150" height="40" rx="0" class="state-rect"/>
  <text x="640" y="365" class="state-text">Đã giao hàng</text>

  <!-- Giao lại: Giao thất bại → Đang giao hàng -->
  <path d="M440 385 L440 408 L530 408 L530 270" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="485" y="402" class="transition-text text-center text-halo">Giao lại</text>

  <!-- Đã giao hàng → Hoàn thành -->
  <line x1="640" y1="385" x2="640" y2="430" class="transition-line" marker-end="url(#arrow)"/>
  <text x="655" y="407" class="transition-text text-left text-halo">KH xác nhận</text>

  <!-- ==================== ROW 5 RIGHT: Hoàn thành ==================== -->
  <rect x="565" y="430" width="150" height="40" rx="0" class="state-rect"/>
  <text x="640" y="450" class="state-text">Hoàn thành</text>

  <!-- END Hoàn thành -->
  <circle cx="640" cy="500" r="9" fill="none" stroke="#111827" stroke-width="1.5"/>
  <circle cx="640" cy="500" r="5" fill="#111827"/>
  <line x1="640" y1="470" x2="640" y2="491" class="transition-line" marker-end="url(#arrow)"/>

  <!-- ==================== NHÁNH HỦY ==================== -->
  <!-- Chờ xác nhận → Đã hủy (KH / Admin hủy) -->
  <path d="M275 70 L15 70 L15 430 L60 430" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="143" y="62" class="transition-text text-center text-halo">KH / Admin hủy</text>

  <!-- Yêu cầu hủy từ Đã thanh toán -->
  <path d="M250 270 L250 395 L135 395 L135 430" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="255" y="360" class="transition-text text-left text-halo">Yêu cầu hủy</text>

  <!-- ==================== ROW 5 LEFT: Đã hủy ==================== -->
  <rect x="60" y="430" width="150" height="40" rx="0" class="state-rect"/>
  <text x="135" y="450" class="state-text">Đã hủy</text>

  <!-- Đã hủy → Hoàn tiền -->
  <line x1="135" y1="470" x2="135" y2="510" class="transition-line" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="155" y="490" class="transition-text text-left text-halo">Đã TT trước</text>

  <!-- ==================== ROW 6 LEFT: Hoàn tiền ==================== -->
  <rect x="60" y="510" width="150" height="40" rx="0" class="state-rect"/>
  <text x="135" y="530" class="state-text">Hoàn tiền</text>

  <!-- END Hoàn tiền -->
  <circle cx="135" cy="580" r="9" fill="none" stroke="#111827" stroke-width="1.5"/>
  <circle cx="135" cy="580" r="5" fill="#111827"/>
  <line x1="135" y1="550" x2="135" y2="571" class="transition-line" marker-end="url(#arrow)"/>

  <!-- ==================== LEGEND ==================== -->
  <line x1="20" y1="620" x2="710" y2="620" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Start state -->
  <circle cx="40" cy="650" r="7" fill="#111827"/>
  <text x="55" y="650" class="legend-text">Trạng thái bắt đầu</text>

  <!-- State -->
  <rect x="200" y="641" width="30" height="18" rx="0" fill="#ffffff" stroke="#111827" stroke-width="1.2"/>
  <text x="240" y="650" class="legend-text">Trạng thái</text>

  <!-- Transition -->
  <line x1="340" y1="650" x2="380" y2="650" class="transition-line" marker-end="url(#arrow)"/>
  <text x="390" y="650" class="legend-text">Chuyển trạng thái</text>

  <!-- End state -->
  <circle cx="540" cy="650" r="7" fill="none" stroke="#111827" stroke-width="1"/>
  <circle cx="540" cy="650" r="4" fill="#111827"/>
  <text x="555" y="650" class="legend-text">Trạng thái kết thúc</text>

</svg>
