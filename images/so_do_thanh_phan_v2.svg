<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="-40 -40 920 645" role="img" style="background-color:#ffffff">
<title>Sơ đồ thành phần hệ thống GearZone</title>
<desc>Kiến trúc 3 lớp của hệ thống GearZone: lớp người dùng, lớp ứng dụng Next.js, lớp dữ liệu</desc>
<style>
  text {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .bg-canvas {
    fill: #ffffff;
    stroke: none;
  }
  /* Containers (Layers) */
  .layer-container {
    fill: #ffffff;
    stroke: #111827;
    stroke-width: 1.5px;
  }
  .layer-title {
    font-size: 13px;
    font-weight: 700;
    fill: #111827;
  }
  /* Sub-containers (API Routes, ORM) */
  .sub-container {
    fill: #f9fafb;
    stroke: #374151;
    stroke-width: 1.2px;
    stroke-dasharray: 4 4;
  }
  .sub-title {
    font-size: 12px;
    font-weight: 600;
    fill: #111827;
  }
  /* Components */
  .component-box {
    fill: #ffffff;
    stroke: #111827;
    stroke-width: 1.2px;
  }
  .component-title {
    font-size: 12px;
    font-weight: 600;
    fill: #111827;
  }
  .component-sub {
    font-size: 11px;
    fill: #4b5563;
  }
  /* Connectors */
  .connector {
    stroke: #374151;
    stroke-width: 1.2px;
    fill: none;
  }
  .connector-dash {
    stroke: #4b5563;
    stroke-width: 1.2px;
    stroke-dasharray: 4 3;
    fill: none;
  }
  .connector-text {
    font-size: 10px;
    font-weight: 600;
    fill: #111827;
  }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#111827" stroke-width="1.5" />
</marker>
</defs>
<rect id="canvas-bg" class="bg-canvas" x="-100" y="-100" width="1040" height="765" />


<g>
  <rect x="20" y="20" width="800" height="92" rx="0" class="layer-container" />
  <text x="36" y="34" dominant-baseline="central" class="layer-title">Lớp người dùng</text>
</g>

<g onclick="sendPrompt('Storefront UI GearZone là gì?')">
  <rect x="40" y="52" width="220" height="40" rx="0" class="component-box" />
  
  <rect x="236" y="56" width="16" height="11" rx="0" ry="0" class="icon-rect" />
  <rect x="233" y="58" width="5" height="3" rx="0" ry="0" class="icon-rect" />
