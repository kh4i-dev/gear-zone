<svg width="100%" viewBox="-40 -40 920 1020" role="img" style="background-color:#ffffff" xmlns="http://www.w3.org/2000/svg">
<title>Activity Diagram — Quy trình mua hàng GearZone</title>
<desc>Sơ đồ hoạt động mua hàng GearZone với 3 swimlane: Khách hàng, Hệ thống, Hệ thống thanh toán</desc>
<style>
  rect:not(#canvas-bg) {
    fill: #ffffff !important;
    stroke: #374151 !important;
    stroke-width: 1px !important;
  }
  #canvas-bg {
    fill: #ffffff !important;
    stroke: none !important;
  }
  polygon {
    fill: #ffffff !important;
    stroke: #374151 !important;
    stroke-width: 1px !important;
  }
  circle {
    stroke: #374151 !important;
  }
  text {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    fill: #111827 !important;
    stroke: none !important;
  }
  line, path {
    stroke: #374151 !important;
    stroke-width: 1px !important;
    fill: none !important;
  }
  .lane-title { font-size: 14px; font-weight: 600; }
  .node-title { font-size: 13px; font-weight: 500; }
  .node-sub { font-size: 11px; fill: #4b5563 !important; }
  .label-text { font-size: 11px; fill: #4b5563 !important; font-weight: 500; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 2L8 5L2 8" fill="none" stroke="#374151" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect id="canvas-bg" x="-100" y="-100" width="1040" height="1140"/>

<!-- ===== SWIMLANE HEADERS ===== -->
<rect x="20" y="20" width="800" height="40" rx="0"/>
<line x1="280" y1="20" x2="280" y2="60"/>
<line x1="560" y1="20" x2="560" y2="60"/>
<text x="150" y="40" text-anchor="middle" dominant-baseline="central" class="lane-title">Khách hàng</text>
<text x="420" y="40" text-anchor="middle" dominant-baseline="central" class="lane-title">Hệ thống GearZone</text>
<text x="690" y="40" text-anchor="middle" dominant-baseline="central" class="lane-title">Hệ thống thanh toán</text>

<!-- Lane separators -->
<line x1="280" y1="60" x2="280" y2="930" stroke-dasharray="4 4"/>
<line x1="560" y1="60" x2="560" y2="930" stroke-dasharray="4 4"/>

<!-- ======================================================== -->
<!-- ● START                                                   -->
<!-- ======================================================== -->
<circle cx="150" cy="85" r="10" fill="#111827" stroke="none"/>
<line x1="150" y1="95" x2="150" y2="115" marker-end="url(#arrow)"/>

<!-- 1. Truy cập GearZone -->
<rect x="70" y="115" width="160" height="36" rx="0"/>
<text x="150" y="133" text-anchor="middle" dominant-baseline="central" class="node-title">Truy cập GearZone</text>
<line x1="150" y1="151" x2="150" y2="175" marker-end="url(#arrow)"/>

<!-- ◇ Diamond: Chưa đăng nhập? -->
<polygon points="150,175 205,198 150,221 95,198"/>
<text x="150" y="198" text-anchor="middle" dominant-baseline="central" class="node-sub">Chưa đăng nhập?</text>

<!-- Chưa → Đăng nhập (trái) -->
<path d="M95 198 L35 198 L35 260 L70 260" marker-end="url(#arrow)"/>
<text x="60" y="189" text-anchor="middle" class="label-text">Chưa</text>

<!-- 2. Đăng nhập hoặc đăng ký -->
<rect x="70" y="242" width="160" height="36" rx="0"/>
<text x="150" y="254" text-anchor="middle" dominant-baseline="central" class="node-title">Đăng nhập</text>
<text x="150" y="268" text-anchor="middle" dominant-baseline="central" class="node-sub">hoặc đăng ký</text>

<!-- Đăng nhập → Tìm kiếm (thẳng xuống) -->
<line x1="150" y1="278" x2="150" y2="325" marker-end="url(#arrow)"/>

<!-- Rồi → merge vào trước Tìm kiếm (phải, xuống, trái) -->
<path d="M205 198 L260 198 L260 305 L158 305" marker-end="url(#arrow)"/>
<text x="238" y="189" text-anchor="middle" class="label-text">Rồi</text>

<!-- 3. Tìm kiếm / chọn danh mục -->
<rect x="70" y="325" width="160" height="44" rx="0"/>
<text x="150" y="341" text-anchor="middle" dominant-baseline="central" class="node-title">Tìm kiếm / chọn</text>
<text x="150" y="358" text-anchor="middle" dominant-baseline="central" class="node-sub">danh mục</text>

<!-- Tìm kiếm → Hiển thị DS (sang phải qua HT lane) -->
<line x1="230" y1="347" x2="320" y2="347" marker-end="url(#arrow)"/>

<!-- 4. Hiển thị danh sách sản phẩm (HT) -->
<rect x="320" y="325" width="200" height="44" rx="0"/>
<text x="420" y="341" text-anchor="middle" dominant-baseline="central" class="node-title">Hiển thị danh sách</text>
<text x="420" y="358" text-anchor="middle" dominant-baseline="central" class="node-sub">sản phẩm</text>

<!-- Hiển thị DS → Xem chi tiết SP (xuống rồi quay trái) -->
<path d="M420 369 L420 390 L150 390 L150 400" marker-end="url(#arrow)"/>

<!-- 5. Xem chi tiết SP -->
<rect x="70" y="400" width="160" height="36" rx="0"/>
<text x="150" y="418" text-anchor="middle" dominant-baseline="central" class="node-title">Xem chi tiết SP</text>
<line x1="150" y1="436" x2="150" y2="455" marker-end="url(#arrow)"/>

<!-- ◇ Diamond: Muốn mua? -->
<polygon points="150,455 205,478 150,501 95,478"/>
<text x="150" y="478" text-anchor="middle" dominant-baseline="central" class="node-sub">Muốn mua?</text>

<!-- Không → quay lại Tìm kiếm (trái, lên) -->
<path d="M95 478 L35 478 L35 347 L70 347" marker-end="url(#arrow)"/>
<text x="60" y="468" text-anchor="middle" class="label-text">Không</text>

<!-- Có → Thêm vào giỏ hàng -->
<line x1="150" y1="501" x2="150" y2="528" marker-end="url(#arrow)"/>
<text x="164" y="514" text-anchor="start" class="label-text">Có</text>

<!-- 6. Thêm vào giỏ hàng -->
<rect x="70" y="528" width="160" height="36" rx="0"/>
<text x="150" y="546" text-anchor="middle" dominant-baseline="central" class="node-title">Thêm vào giỏ hàng</text>
<line x1="150" y1="564" x2="150" y2="585" marker-end="url(#arrow)"/>

<!-- ◇ Diamond: Tiếp tục mua? -->
<polygon points="150,585 205,608 150,631 95,608"/>
<text x="150" y="608" text-anchor="middle" dominant-baseline="central" class="node-sub">Tiếp tục mua?</text>

<!-- Có → quay lại Tìm kiếm (phải, lên) -->
<path d="M205 608 L260 608 L260 305 L158 305" marker-end="url(#arrow)"/>
<text x="238" y="598" text-anchor="middle" class="label-text">Có</text>

<!-- Không → Xem & xác nhận giỏ hàng -->
<path d="M95 608 L35 608 L35 688 L70 688" marker-end="url(#arrow)"/>
<text x="60" y="598" text-anchor="middle" class="label-text">Không</text>

<!-- 7. Xem & xác nhận giỏ hàng -->
<rect x="70" y="670" width="160" height="36" rx="0"/>
<text x="150" y="682" text-anchor="middle" dominant-baseline="central" class="node-title">Xem &amp; xác nhận</text>
<text x="150" y="696" text-anchor="middle" dominant-baseline="central" class="node-sub">giỏ hàng</text>

<!-- Xem xác nhận → Kiểm tra tồn kho (sang HT) -->
<line x1="230" y1="688" x2="320" y2="688" marker-end="url(#arrow)"/>

<!-- 8. Kiểm tra tồn kho & tính phí (HT) -->
<rect x="320" y="670" width="200" height="36" rx="0"/>
<text x="420" y="682" text-anchor="middle" dominant-baseline="central" class="node-title">Kiểm tra tồn kho</text>
<text x="420" y="696" text-anchor="middle" dominant-baseline="central" class="node-sub">&amp; tính phí</text>

<!-- Kiểm tra kho → Nhập địa chỉ (xuống rồi quay trái) -->
<path d="M420 706 L420 728 L150 728 L150 745" marker-end="url(#arrow)"/>

<!-- 9. Nhập địa chỉ & chọn phương thức TT -->
<rect x="50" y="745" width="200" height="36" rx="0"/>
<text x="150" y="757" text-anchor="middle" dominant-baseline="central" class="node-title">Nhập địa chỉ</text>
<text x="150" y="771" text-anchor="middle" dominant-baseline="central" class="node-sub">&amp; chọn phương thức TT</text>

<!-- Nhập địa chỉ → Tạo đơn hàng -->
<line x1="250" y1="763" x2="320" y2="763" marker-end="url(#arrow)"/>

<!-- 10. Tạo đơn hàng & lưu DB (HT) -->
<rect x="320" y="745" width="200" height="36" rx="0"/>
<text x="420" y="757" text-anchor="middle" dominant-baseline="central" class="node-title">Tạo đơn hàng</text>
<text x="420" y="771" text-anchor="middle" dominant-baseline="central" class="node-sub">&amp; lưu DB</text>

<!-- Tạo đơn hàng → Xử lý thanh toán (Online) -->
<line x1="520" y1="763" x2="590" y2="763" marker-end="url(#arrow)"/>
<text x="555" y="753" text-anchor="middle" class="label-text">Online</text>

<!-- 11. Xử lý thanh toán VNPay / MoMo (HTTT) -->
<rect x="590" y="745" width="200" height="36" rx="0"/>
<text x="690" y="757" text-anchor="middle" dominant-baseline="central" class="node-title">Xử lý thanh toán</text>
<text x="690" y="771" text-anchor="middle" dominant-baseline="central" class="node-sub">VNPay / MoMo</text>

<!-- Tạo đơn hàng → Cập nhật TT (COD, xuống) -->
<line x1="420" y1="781" x2="420" y2="830" marker-end="url(#arrow)"/>
<text x="435" y="805" text-anchor="start" class="label-text">COD</text>

<!-- Xử lý TT → Cập nhật TT (Kết quả TT) -->
<path d="M690 781 L690 848 L540 848" marker-end="url(#arrow)"/>
<text x="625" y="838" text-anchor="middle" class="label-text">Kết quả TT</text>

<!-- 12. Cập nhật trạng thái ĐH & gửi email (HT) -->
<rect x="300" y="830" width="240" height="36" rx="0"/>
<text x="420" y="842" text-anchor="middle" dominant-baseline="central" class="node-title">Cập nhật trạng thái ĐH</text>
<text x="420" y="856" text-anchor="middle" dominant-baseline="central" class="node-sub">&amp; gửi email xác nhận</text>

<!-- Cập nhật TT → Theo dõi ĐH -->
<line x1="300" y1="848" x2="230" y2="848" marker-end="url(#arrow)"/>

<!-- 13. Theo dõi đơn hàng -->
<rect x="70" y="830" width="160" height="36" rx="0"/>
<text x="150" y="848" text-anchor="middle" dominant-baseline="central" class="node-title">Theo dõi đơn hàng</text>
<line x1="150" y1="866" x2="150" y2="900" marker-end="url(#arrow)"/>

<!-- ◉ END -->
<circle cx="150" cy="910" r="10" fill="none" stroke="#374151" stroke-width="1.5"/>
<circle cx="150" cy="910" r="6" fill="#111827" stroke="none"/>

</svg>
