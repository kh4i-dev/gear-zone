<svg width="100%" viewBox="0 0 1400 880" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Sơ đồ chức năng hệ thống GearZone</title>
  <desc>Sơ đồ phân rã chức năng của website bán phụ kiện máy tính gaming GearZone.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .root { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .group { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
      .leaf { fill: #ffffff; stroke: #111827; stroke-width: 1.2; }
      .root-text { fill: #111827; font: 700 22px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .group-text { fill: #111827; font: 700 15px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .leaf-text { fill: #111827; font: 500 13px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .note-text { fill: #4b5563; font: 500 12px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .line { stroke: #111827; stroke-width: 1.4; fill: none; }
    </style>
  </defs>

  <rect id="canvas-bg" class="bg" x="-10" y="-10" width="1420" height="900" stroke="none"/>

  <!-- ===== ROOT ===== -->
  <rect class="root" x="530" y="30" width="340" height="60" rx="0"/>
  <text class="root-text" x="700" y="60" text-anchor="middle" dominant-baseline="central">Hệ thống GearZone</text>

  <!-- Trunk down from root -->
  <path class="line" d="M700 90 V130"/>

  <!-- ===== ROW 1 horizontal bar ===== -->
  <path class="line" d="M175 130 H1225"/>

  <!-- Drops from bar to group titles row 1 -->
  <path class="line" d="M175 130 V170"/>
  <path class="line" d="M525 130 V170"/>
  <path class="line" d="M875 130 V170"/>
  <path class="line" d="M1225 130 V170"/>

  <!-- ===== 1. Xác thực ===== -->
  <rect class="group" x="55" y="170" width="240" height="48" rx="0"/>
  <text class="group-text" x="175" y="194" text-anchor="middle" dominant-baseline="central">1. Xác thực</text>
  <path class="line" d="M175 218 V240"/>
  <rect class="leaf" x="55" y="240" width="240" height="44" rx="0"/>
  <text class="leaf-text" x="175" y="262" text-anchor="middle" dominant-baseline="central">Đăng ký</text>
  <path class="line" d="M175 284 V306"/>
  <rect class="leaf" x="55" y="306" width="240" height="44" rx="0"/>
  <text class="leaf-text" x="175" y="328" text-anchor="middle" dominant-baseline="central">Đăng nhập</text>
  <path class="line" d="M175 350 V372"/>
  <rect class="leaf" x="55" y="372" width="240" height="44" rx="0"/>
  <text class="leaf-text" x="175" y="394" text-anchor="middle" dominant-baseline="central">Đăng xuất</text>

  <!-- ===== 2. Sản phẩm ===== -->
  <rect class="group" x="405" y="170" width="240" height="48" rx="0"/>
  <text class="group-text" x="525" y="194" text-anchor="middle" dominant-baseline="central">2. Sản phẩm</text>
  <path class="line" d="M525 218 V240"/>
  <rect class="leaf" x="395" y="240" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="525" y="262" text-anchor="middle" dominant-baseline="central">Xem danh sách sản phẩm</text>
  <path class="line" d="M525 284 V306"/>
  <rect class="leaf" x="395" y="306" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="525" y="328" text-anchor="middle" dominant-baseline="central">Tìm kiếm / lọc sản phẩm</text>
  <path class="line" d="M525 350 V372"/>
  <rect class="leaf" x="395" y="372" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="525" y="394" text-anchor="middle" dominant-baseline="central">Xem chi tiết sản phẩm</text>

  <!-- ===== 3. Mua hàng ===== -->
  <rect class="group" x="755" y="170" width="240" height="48" rx="0"/>
  <text class="group-text" x="875" y="194" text-anchor="middle" dominant-baseline="central">3. Mua hàng</text>
  <path class="line" d="M875 218 V240"/>
  <rect class="leaf" x="745" y="240" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="875" y="262" text-anchor="middle" dominant-baseline="central">Thêm vào giỏ hàng</text>
  <path class="line" d="M875 284 V306"/>
  <rect class="leaf" x="745" y="306" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="875" y="328" text-anchor="middle" dominant-baseline="central">Cập nhật giỏ hàng</text>
  <path class="line" d="M875 350 V372"/>
  <rect class="leaf" x="745" y="372" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="875" y="394" text-anchor="middle" dominant-baseline="central">Đặt hàng</text>

  <!-- ===== 4. Thanh toán ===== -->
  <rect class="group" x="1105" y="170" width="240" height="48" rx="0"/>
  <text class="group-text" x="1225" y="194" text-anchor="middle" dominant-baseline="central">4. Thanh toán</text>
  <path class="line" d="M1225 218 V240"/>
  <rect class="leaf" x="1095" y="240" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1225" y="262" text-anchor="middle" dominant-baseline="central">Thanh toán online</text>
  <path class="line" d="M1225 284 V306"/>
  <rect class="leaf" x="1095" y="306" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1225" y="328" text-anchor="middle" dominant-baseline="central">Xác nhận thanh toán</text>
  <path class="line" d="M1225 350 V372"/>
  <rect class="leaf" x="1095" y="372" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1225" y="394" text-anchor="middle" dominant-baseline="central">Hoàn tiền / COD</text>

  <!-- ===== Trunk continues to ROW 2 ===== -->
  <path class="line" d="M700 130 V490"/>

  <!-- ===== ROW 2 horizontal bar ===== -->
  <path class="line" d="M350 490 H1050"/>

  <!-- Drops from bar to group titles row 2 -->
  <path class="line" d="M350 490 V530"/>
  <path class="line" d="M700 490 V530"/>
  <path class="line" d="M1050 490 V530"/>

  <!-- ===== 5. Quản trị ===== -->
  <rect class="group" x="230" y="530" width="240" height="48" rx="0"/>
  <text class="group-text" x="350" y="554" text-anchor="middle" dominant-baseline="central">5. Quản trị</text>
  <path class="line" d="M350 578 V600"/>
  <rect class="leaf" x="220" y="600" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="350" y="622" text-anchor="middle" dominant-baseline="central">Quản lý người dùng</text>
  <path class="line" d="M350 644 V666"/>
  <rect class="leaf" x="220" y="666" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="350" y="688" text-anchor="middle" dominant-baseline="central">Quản lý danh mục</text>
  <path class="line" d="M350 710 V732"/>
  <rect class="leaf" x="220" y="732" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="350" y="754" text-anchor="middle" dominant-baseline="central">Cấu hình hệ thống</text>

  <!-- ===== 6. Đơn hàng ===== -->
  <rect class="group" x="580" y="530" width="240" height="48" rx="0"/>
  <text class="group-text" x="700" y="554" text-anchor="middle" dominant-baseline="central">6. Đơn hàng</text>
  <path class="line" d="M700 578 V600"/>
  <rect class="leaf" x="570" y="600" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="700" y="622" text-anchor="middle" dominant-baseline="central">Quản lý đơn hàng</text>
  <path class="line" d="M700 644 V666"/>
  <rect class="leaf" x="570" y="666" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="700" y="688" text-anchor="middle" dominant-baseline="central">Theo dõi trạng thái</text>
  <path class="line" d="M700 710 V732"/>
  <rect class="leaf" x="570" y="732" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="700" y="754" text-anchor="middle" dominant-baseline="central">Xử lý hủy đơn</text>

  <!-- ===== 7. Kho vận ===== -->
  <rect class="group" x="930" y="530" width="240" height="48" rx="0"/>
  <text class="group-text" x="1050" y="554" text-anchor="middle" dominant-baseline="central">7. Kho vận</text>
  <path class="line" d="M1050 578 V600"/>
  <rect class="leaf" x="920" y="600" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1050" y="622" text-anchor="middle" dominant-baseline="central">Cập nhật kho</text>
  <path class="line" d="M1050 644 V666"/>
  <rect class="leaf" x="920" y="666" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1050" y="688" text-anchor="middle" dominant-baseline="central">Xuất kho</text>
  <path class="line" d="M1050 710 V732"/>
  <rect class="leaf" x="920" y="732" width="260" height="44" rx="0"/>
  <text class="leaf-text" x="1050" y="754" text-anchor="middle" dominant-baseline="central">Vận chuyển / trả hàng</text>

  <!-- Note -->
  <text class="note-text" x="700" y="820" text-anchor="middle">
    Sơ đồ chức năng được sắp xếp theo nhóm nghiệp vụ: khách hàng, thanh toán, quản trị, đơn hàng và kho vận.
  </text>

</svg>