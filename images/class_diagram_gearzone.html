
<style>
#cd { width:100%; overflow-x:auto; }
#cd svg { min-width:600px; overflow:visible; }
#cd svg .classTitle { font-weight:500 !important; }
#cd svg .node rect,
#cd svg .node path {
  fill: #ffffff !important;
  stroke: #4b5563 !important;
  stroke-width: 1.2px !important;
}
#cd svg .node .label,
#cd svg .node text,
#cd svg .classText,
#cd svg .classTitle {
  fill: #111827 !important;
  color: #111827 !important;
}
#cd svg .divider {
  stroke: #9ca3af !important;
}
#cd svg .edgePath path,
#cd svg .relationshipLine {
  stroke: #6b7280 !important;
}
#cd svg .edgeLabel,
#cd svg .edgeLabel p {
  color: #374151 !important;
  background: #ffffff !important;
}
#cd svg .edgeLabel {
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 4px;
}
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: false,
    background: '#ffffff',
    mainBkg: '#ffffff',
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: '#6b7280',
    textColor: '#111827',
    primaryColor: '#ffffff',
    primaryTextColor: '#111827',
    primaryBorderColor: '#4b5563',
    secondaryColor: '#f9fafb',
    tertiaryColor: '#f3f4f6',
  },
});

const diagram = `classDiagram
  class TaiKhoan {
    <<abstract>>
    +int maTK
    +String hoTen
    +String email
    -String matKhau
    +dangNhap(String email, String mk) bool
    +dangXuat() void
    +capNhatThongTin() void
  }

  class KhachHang {
    +String soDienThoai
    +String diaChi
    +xemDonHang() List
  }

  class NhanVienKho {
    +xuatKho(maDH) void
    +capNhatKho(maSP, sl) void
    +xemDonHang() List
  }

  class Admin {
    +quanLyNguoiDung() void
    +quanLySanPham() void
    +quanLyDonHang() void
    +xemBaoCao() void
    +cauHinhHeThong() void
  }

  class SanPham {
    +int maSP
    +String tenSP
    +String thuongHieu
    +double giaBan
    +int soLuongTon
    +String moTa
    +timKiem(tuKhoa) List
    +xemChiTiet() SanPham
  }

  class DanhMuc {
    +int maDM
    +String tenDM
    +String moTa
    +layDanhSachSP() List
  }

  class GioHang {
    +int maGH
    +Date ngayTao
    +themSP(maSP, soLuong) void
    +xoaSP(maSP) void
    +capNhatSoLuong(maSP, sl) void
    +tinhTongTien() double
    +lamMoi() void
  }

  class ChiTietGioHang {
    +int soLuong
    +double donGia
    +tinhThanhTien() double
  }

  class MaGiamGia {
    +int maMGG
    +String code
    +double phanTram
    +Date ngayBatDau
    +Date ngayKetThuc
    +int soLuongToiDa
    +int daSuDung
    +kiemTraHopLe() bool
    +apDung(tongTien) double
  }

  class DonHang {
    +int maDH
    +Date ngayDat
    +String trangThai
    +double tongTien
    +double tienGiam
    +String diaChiGiao
    +String phuongThucTT
    +taoMoi() bool
    +huy() bool
    +capNhatTrangThai(tt) void
  }

  class ChiTietDonHang {
    +int soLuong
    +double donGia
    +tinhThanhTien() double
  }

  class ThanhToan {
    +int maTT
    +String phuongThuc
    +double soTien
    +String trangThai
    +String maGiaoDich
    +Date thoiGian
    +thucHien() bool
    +xacNhan() void
    +hoanTien() bool
  }

  class HuyDon {
    +int maHD
    +Date ngayHuy
    +String lyDo
    +taoYeuCau() bool
    +xacNhan() void
  }

  class DanhGia {
    +int maDG
    +int soSao
    +String noiDung
    +Date ngayDang
    +gui() void
    +sua() void
    +xoa() void
  }

  TaiKhoan <|-- KhachHang
  TaiKhoan <|-- NhanVienKho
  TaiKhoan <|-- Admin

  KhachHang "1" --> "0..1" GioHang : sở hữu
  KhachHang "1" --> "0..*" DonHang : đặt
  KhachHang "1" --> "0..*" DanhGia : viết
  GioHang "1" *-- "0..*" ChiTietGioHang : chứa
  DonHang "1" *-- "1..*" ChiTietDonHang : gồm
  DonHang "1" --> "0..1" ThanhToan : có
  DonHang "1" --> "0..1" HuyDon : bị hủy
  DonHang "0..*" --> "0..1" MaGiamGia : áp dụng
  SanPham "0..*" --> "1" DanhMuc : thuộc
  SanPham "1" --> "0..*" ChiTietGioHang : tham chiếu
  SanPham "1" --> "0..*" ChiTietDonHang : tham chiếu
  SanPham "1" --> "0..*" DanhGia : nhận
  NhanVienKho --> DonHang : xử lý
  Admin --> SanPham : quản lý
  HuyDon --> ThanhToan : kích hoạt hoàn tiền
`;

const { svg } = await mermaid.render('cd-svg', diagram);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#cd svg .edgeLabel').forEach(label => {
  label.parentNode.appendChild(label);
});

const svgEl = document.querySelector('#cd svg');
const edgeLabels = svgEl?.querySelector('.edgeLabels');
if (svgEl && edgeLabels) {
  svgEl.appendChild(edgeLabels);
}
</script>
