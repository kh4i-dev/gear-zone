<svg width="100%" viewBox="-40 -40 1480 1000" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Sơ đồ chức năng hệ thống GearZone</title>
  <desc>Sơ đồ phân rã chức năng của website bán phụ kiện máy tính gaming GearZone.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .root { fill: #ffffff; stroke: #111827; stroke-width: 2; }
      .group { fill: #ffffff; stroke: #111827; stroke-width: 1.8; }
      .leaf { fill: #ffffff; stroke: #111827; stroke-width: 1.4; }
      .root-text { fill: #111827; font: 700 24px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .group-text { fill: #111827; font: 700 18px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .leaf-text { fill: #111827; font: 500 14px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .note-text { fill: #4b5563; font: 500 13px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .line { stroke: #111827; stroke-width: 1.2; fill: none; }
      .section { fill: #ffffff; stroke: #111827; stroke-width: 1; }
    </style>
  </defs>

  <rect id="canvas-bg" class="bg" x="-100" y="-100" width="1600" height="1120" stroke="none"/>

  <!-- Root -->
  <rect class="root" x="515" y="36" width="400" height="72" rx="0"/>
  <text class="root-text" x="715" y="72" text-anchor="middle" dominant-baseline="central">Hệ thống GearZone</text>

  <!-- Main split -->
  <path class="line" d="M715 108 V150"/>
  <path class="line" d="M210 150 H1210"/>
  <path class="line" d="M210 150 V190"/>
  <path class="line" d="M550 150 V190"/>
  <path class="line" d="M890 150 V190"/>
  <path class="line" d="M1210 150 V190"/>

  <!-- Row 1 groups -->
  <g>
    <rect class="section" x="60" y="180" width="300" height="310" rx="0"/>
    <rect class="group" x="105" y="210" width="210" height="58" rx="0"/>
    <text class="group-text" x="210" y="239" text-anchor="middle" dominant-baseline="central">1. Xác thực</text>
    <path class="line" d="M210 268 V296"/>
    <path class="line" d="M210 296 H210"/>
    <rect class="leaf" x="100" y="315" width="220" height="44" rx="0"/>
    <text class="leaf-text" x="210" y="337" text-anchor="middle" dominant-baseline="central">Đăng ký</text>
    <rect class="leaf" x="100" y="374" width="220" height="44" rx="0"/>
    <text class="leaf-text" x="210" y="396" text-anchor="middle" dominant-baseline="central">Đăng nhập</text>
    <rect class="leaf" x="100" y="433" width="220" height="44" rx="0"/>
    <text class="leaf-text" x="210" y="455" text-anchor="middle" dominant-baseline="central">Đăng xuất</text>
  </g>

  <g>
    <rect class="section" x="400" y="180" width="300" height="310" rx="0"/>
    <rect class="group" x="445" y="210" width="210" height="58" rx="0"/>
    <text class="group-text" x="550" y="239" text-anchor="middle" dominant-baseline="central">2. Sản phẩm</text>
    <path class="line" d="M550 268 V296"/>
    <rect class="leaf" x="430" y="300" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="550" y="322" text-anchor="middle" dominant-baseline="central">Xem danh sách sản phẩm</text>
    <rect class="leaf" x="430" y="356" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="550" y="378" text-anchor="middle" dominant-baseline="central">Tìm kiếm / lọc sản phẩm</text>
    <rect class="leaf" x="430" y="412" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="550" y="434" text-anchor="middle" dominant-baseline="central">Xem chi tiết sản phẩm</text>
  </g>

  <g>
    <rect class="section" x="740" y="180" width="300" height="310" rx="0"/>
    <rect class="group" x="785" y="210" width="210" height="58" rx="0"/>
    <text class="group-text" x="890" y="239" text-anchor="middle" dominant-baseline="central">3. Mua hàng</text>
    <path class="line" d="M890 268 V296"/>
    <rect class="leaf" x="770" y="300" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="890" y="322" text-anchor="middle" dominant-baseline="central">Thêm vào giỏ hàng</text>
    <rect class="leaf" x="770" y="356" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="890" y="378" text-anchor="middle" dominant-baseline="central">Cập nhật giỏ hàng</text>
    <rect class="leaf" x="770" y="412" width="240" height="44" rx="0"/>
    <text class="leaf-text" x="890" y="434" text-anchor="middle" dominant-baseline="central">Đặt hàng</text>
  </g>

  <g>
    <rect class="section" x="1080" y="180" width="260" height="310" rx="0"/>
    <rect class="group" x="1105" y="210" width="210" height="58" rx="0"/>
    <text class="group-text" x="1210" y="239" text-anchor="middle" dominant-baseline="central">4. Thanh toán</text>
    <path class="line" d="M1210 268 V296"/>
    <rect class="leaf" x="1105" y="300" width="210" height="44" rx="0"/>
    <text class="leaf-text" x="1210" y="322" text-anchor="middle" dominant-baseline="central">Thanh toán online</text>
    <rect class="leaf" x="1105" y="356" width="210" height="44" rx="0"/>
    <text class="leaf-text" x="1210" y="378" text-anchor="middle" dominant-baseline="central">Xác nhận thanh toán</text>
    <rect class="leaf" x="1105" y="412" width="210" height="44" rx="0"/>
    <text class="leaf-text" x="1210" y="434" text-anchor="middle" dominant-baseline="central">Hoàn tiền / COD</text>
  </g>

  <!-- Row 2 split -->
  <path class="line" d="M715 108 V530"/>
  <path class="line" d="M300 530 H1100"/>
  <path class="line" d="M300 530 V570"/>
  <path class="line" d="M700 530 V570"/>
  <path class="line" d="M1100 530 V570"/>

  <!-- Row 2 groups -->
  <g>
    <rect class="section" x="140" y="560" width="320" height="295" rx="0"/>
    <rect class="group" x="195" y="590" width="210" height="58" rx="0"/>
    <text class="group-text" x="300" y="619" text-anchor="middle" dominant-baseline="central">5. Quản trị</text>
    <path class="line" d="M300 648 V676"/>
    <rect class="leaf" x="175" y="680" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="300" y="701" text-anchor="middle" dominant-baseline="central">Quản lý người dùng</text>
    <rect class="leaf" x="175" y="732" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="300" y="753" text-anchor="middle" dominant-baseline="central">Quản lý danh mục</text>
    <rect class="leaf" x="175" y="784" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="300" y="805" text-anchor="middle" dominant-baseline="central">Cấu hình hệ thống</text>
  </g>

  <g>
    <rect class="section" x="540" y="560" width="320" height="295" rx="0"/>
    <rect class="group" x="595" y="590" width="210" height="58" rx="0"/>
    <text class="group-text" x="700" y="619" text-anchor="middle" dominant-baseline="central">6. Đơn hàng</text>
    <path class="line" d="M700 648 V676"/>
    <rect class="leaf" x="575" y="680" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="700" y="701" text-anchor="middle" dominant-baseline="central">Quản lý đơn hàng</text>
    <rect class="leaf" x="575" y="732" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="700" y="753" text-anchor="middle" dominant-baseline="central">Theo dõi trạng thái</text>
    <rect class="leaf" x="575" y="784" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="700" y="805" text-anchor="middle" dominant-baseline="central">Xử lý hủy đơn</text>
  </g>

  <g>
    <rect class="section" x="940" y="560" width="320" height="295" rx="0"/>
    <rect class="group" x="995" y="590" width="210" height="58" rx="0"/>
    <text class="group-text" x="1100" y="619" text-anchor="middle" dominant-baseline="central">7. Kho vận</text>
    <path class="line" d="M1100 648 V676"/>
    <rect class="leaf" x="975" y="680" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="1100" y="701" text-anchor="middle" dominant-baseline="central">Cập nhật kho</text>
    <rect class="leaf" x="975" y="732" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="1100" y="753" text-anchor="middle" dominant-baseline="central">Xuất kho</text>
    <rect class="leaf" x="975" y="784" width="250" height="42" rx="0"/>
    <text class="leaf-text" x="1100" y="805" text-anchor="middle" dominant-baseline="central">Vận chuyển / trả hàng</text>
  </g>

  <text class="note-text" x="700" y="890" text-anchor="middle">
    Sơ đồ chức năng được sắp xếp theo nhóm nghiệp vụ: khách hàng, thanh toán, quản trị, đơn hàng và kho vận.
  </text>
</svg>
